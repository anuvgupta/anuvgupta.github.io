<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anuv Gupta</title>
  <meta name="description" content="Projects by Anuv Gupta, engineer and artist.">
  <meta name="theme-color" content="#245edb">
  <link rel="icon" href="img/icons/projects.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <main id="desktop" class="desktop" aria-label="Desktop">
    <div id="desktop-icons" class="desktop-icons" role="list"></div>
  </main>

  <div id="start-menu" class="start-menu" role="dialog" aria-label="Start menu" hidden>
    <div class="sm-header">
      <div class="user-tile" aria-hidden="true">AG</div>
      <span class="sm-user">Anuv Gupta</span>
    </div>
    <div class="sm-body">
      <label class="sm-search">
        <img src="img/icons/search.svg" alt="" width="16" height="16">
        <input id="start-search" type="search" placeholder="Search pages" autocomplete="off" spellcheck="false" aria-label="Search pages">
      </label>
      <div class="sm-sep"></div>
      <ul id="start-list" class="sm-list" role="list"></ul>
    </div>
    <div class="sm-footer"></div>
  </div>

  <footer class="taskbar">
    <button id="start-button" class="start-button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="start-menu">start</button>
    <div id="tasks" class="taskbar-tasks" role="toolbar" aria-label="Open windows"></div>
    <div class="tray">
      <div id="balloon" class="balloon" role="status" hidden></div>
      <time id="clock" class="clock"></time>
    </div>
  </footer>

  <noscript>
    <div class="noscript">This site needs JavaScript. See <a href="https://github.com/anuvgupta">github.com/anuvgupta</a>.</div>
  </noscript>
</body>
</html>
