<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21803f"/>
      <stop offset="1" stop-color="#0b4322"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f55"/>
      <stop offset="1" stop-color="#1b1e22"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a5fd0"/>
      <stop offset=".45" stop-color="#7fb0ff"/>
      <stop offset="1" stop-color="#1d46a8"/>
    </linearGradient>
    <radialGradient id="led" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset=".35" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#b3160d"/>
    </radialGradient>
  </defs>

  <!-- Board -->
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="4" fill="url(#board)" stroke="#d9b85a" stroke-opacity=".22" stroke-width=".5"/>

  <!-- Copper traces -->
  <g fill="none" stroke="#f2c650" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 9V6.5H6.5"/>
    <path d="M16 9V6"/>
    <path d="M19 9V7.5l2-2h4.5"/>
    <path d="M23 13.5h3"/>
    <path d="M26 19v6.5"/>
    <path d="M19 23v2.5h7"/>
    <path d="M16 23v3h-4"/>
    <path d="M9 16H6.5v-4"/>
    <path d="M9 18.5H6.5v3"/>
  </g>

  <!-- Vias -->
  <g fill="#f3cf6b" stroke="#a9781c" stroke-width=".6">
    <circle cx="6.5" cy="6.5" r="2"/>
    <circle cx="25.5" cy="5.5" r="2"/>
    <circle cx="6.5" cy="12" r="2"/>
    <circle cx="12" cy="26" r="2"/>
    <circle cx="26" cy="25.5" r="2"/>
  </g>
  <g fill="#0d3a1f">
    <circle cx="6.5" cy="6.5" r=".6"/>
    <circle cx="25.5" cy="5.5" r=".6"/>
    <circle cx="6.5" cy="12" r=".6"/>
    <circle cx="12" cy="26" r=".6"/>
    <circle cx="26" cy="25.5" r=".6"/>
  </g>

  <!-- Chip pins -->
  <g fill="#d9dde1">
    <rect x="12.4" y="9" width="1.2" height="2"/>
    <rect x="15.4" y="9" width="1.2" height="2"/>
    <rect x="18.4" y="9" width="1.2" height="2"/>
    <rect x="12.4" y="21" width="1.2" height="2"/>
    <rect x="15.4" y="21" width="1.2" height="2"/>
    <rect x="18.4" y="21" width="1.2" height="2"/>
    <rect x="9" y="12.9" width="2" height="1.2"/>
    <rect x="9" y="15.4" width="2" height="1.2"/>
    <rect x="9" y="17.9" width="2" height="1.2"/>
    <rect x="21" y="12.9" width="2" height="1.2"/>
    <rect x="21" y="15.4" width="2" height="1.2"/>
    <rect x="21" y="17.9" width="2" height="1.2"/>
  </g>

  <!-- Chip -->
  <rect x="10.5" y="10.5" width="11" height="11" rx="1" fill="url(#chip)" stroke="#0e1012" stroke-width=".8"/>
  <circle cx="12.6" cy="12.6" r=".8" fill="#6b7178"/>
  <path d="M11.5 11.3h9" stroke="#fff" stroke-opacity=".18" stroke-width=".6"/>

  <!-- Capacitor (bottom left) -->
  <circle cx="6.5" cy="24" r="3" fill="url(#cap)" stroke="#132f73" stroke-width=".7"/>
  <path d="M4.9 22.7a2 2 0 0 1 3.2 0" fill="none" stroke="#dbe8ff" stroke-width=".7" stroke-opacity=".8"/>

  <!-- Resistor (right) -->
  <rect x="24.5" y="11.5" width="3" height="7.5" rx="1.4" fill="#e4cf9d" stroke="#8a6f3a" stroke-width=".6"/>
  <rect x="24.7" y="13" width="2.6" height=".9" fill="#b3261e"/>
  <rect x="24.7" y="14.7" width="2.6" height=".9" fill="#4a2e14"/>
  <rect x="24.7" y="16.4" width="2.6" height=".9" fill="#d89a1c"/>

  <!-- LED (top) -->
  <circle cx="16" cy="5" r="2.2" fill="url(#led)" stroke="#6e0d07" stroke-width=".6"/>
</svg>
